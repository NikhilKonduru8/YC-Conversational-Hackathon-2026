[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "1.0.0"
description = "Jarvis — standalone wearable engineering assistant for Raspberry Pi"
requires-python = ">=3.11, <3.14"

dependencies = [
    # LiveKit Inference STT + TTS, used standalone (no room/agent session).
    # Also provides rtc.AudioFrame. No plugin extras needed.
    "livekit-agents==1.5.16",
    # Local wake-word detection ("hey jarvis").
    "openwakeword>=0.6",
    # Utterance endpointing (detect when the user stops talking).
    "webrtcvad>=2.0.10",
    # webrtcvad imports the legacy pkg_resources at runtime; py3.13 venvs omit
    # it, and setuptools>=81 removed pkg_resources, so pin in between.
    "setuptools>=70,<81",
    # USB mic capture + USB speaker playback.
    "sounddevice>=0.4",
    "numpy>=1.26",
    # USB camera frame capture.
    "opencv-python-headless>=4.9",
    "pillow>=10",
    # Moss semantic search over component specs.
    "moss>=1.4",
    # Qwen-2.5-VL (vision) + MiniMax via TrueFoundry (reasoning), both
    # OpenAI-compatible.
    "openai>=1.40",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]
# Raspberry Pi OLED display libs. Install on the Pi with: uv sync --group pi
# (omitted on dev laptops; the display module no-ops without them).
pi = [
    "luma-oled>=3.12",
]

[tool.uv]
# yarl 1.24.1 shipped a cp310-only wheel; pin below it for 3.11+ installs.
constraint-dependencies = ["yarl<1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
